[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

# Fuzz test settings
[profile.default.fuzz]
runs = 256

# Coverage config
[fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4

# RPC endpoints (used by forge script/cast for testnet deploys)
[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
